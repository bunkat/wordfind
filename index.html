<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Word Find</title>
    <link rel="stylesheet" type="text/css" href="wordfind.css">
</head>
<body>
    <h1>WordFind.js by BunKat &amp; Lucas-C</h1>
    <div id="main" role="main">
        <div id="puzzle"></div>
        <div id="words-editor">
            <p>List of hidden words</p>
            <ul id="words"></ul>
            <div>
                <button onclick="WordFindGame.insertWord($('#words'))">Add word</button>
                <button onclick="$('#words').children().last().remove()">Remove last word</button>
            </div>
        </div>
        <fieldset id="controls">
            <label for="allowed-missing-words">Allowed missing words :
                <input id="allowed-missing-words" type="number" min="0" max="10" step="1" value="2">
            </label>
            <label for="max-grid-growth">Max grid growth :
                <input id="max-grid-growth" type="number" min="0" max="5" step="1" value="0">
            </label>
            <label for="max-attemps-per-grid-and-wordset">Max attemps per grid &amp; wordset :
                <input id="max-attemps-per-grid-and-wordset" type="number" min="1" max="999" step="1" value="100">
            </label>
            <label for="prefer-letter-overlaps">Prefer letter overlap :
                <input id="prefer-letter-overlaps" type="checkbox" checked>
            </label>
            <label for="filling-letters">Filling letters :
                <select id="filling-letters" selected>
                    <option value="secret-word">form a secret word</option>
                    <option value="none">none, allow blanks</option>
                    <option value="secret-word-plus-blanks">form a secret word but allow for extra blanks</option>
                    <option value="random">random</option>
                </select>
            </label>
            <label for="max-fillings">Max filling blanks/letters:
                <input id="max-fillings" type="number" min="1" max="100" step="1" value="30">
            </label>
            <label for="color-filling-letters">Color filling letters:
                <input id="color-filling-letters" type="checkbox" checked>
            </label>
            <label for="secret-word">Secret word:
                <input id="secret-word">
            </label>
            <br><br>
            <button type="submit" onclick="recreateGrid()">Recreate grid</button>
            <p id="result-message"></p>
            <button type="submit" onclick="game.solve()">Solve Puzzle</button>
            <button type="submit" onclick="game.downloadSvgGrid()">Download grid as SVG image</button>
        </fieldset>
    </div>

    <footer>
        Source code: <a href="https://github.com/Lucas-C/wordfind">github.com/Lucas-C/wordfind</a>
    </footer>

    <script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js"></script> 
    <script type="text/javascript" src="wordfind.js"></script> 
    <script type="text/javascript" src="wordfindgame.js"></script> 
    <script>
    /* Example words setup */
    [
        /*'adorable',
        'comique',
        'curieuse',
        'drole',
        'engagee',
        'enjouee',
        'fidele',
        'futee',
        'radieuse',
        'sensible',
        'sincere',*/
        'complice',
        'creative',
        'elegante',
        'farceuse',
        'joviale',
        'motivee',
        'ordonnee',
        'prudente',
        'sexy',
        'tendre',
    ].map(word => WordFindGame.insertWord($('#words'), word));
    $('#secret-word').val('LAETITIA');

    /* Init */
    window.recreateGrid = function() {
        $('#puzzle').children().remove();
        var fillBlanks, game;
        if ($('#filling-letters').val() === 'none') {
            fillBlanks = false;
        } else if ($('#filling-letters').val().startsWith('secret-word')) {
            fillBlanks = $('#secret-word').val();
        }
        try {
            game = new WordFindGame('#puzzle', {
                allowedMissingWords: +$('#allowed-missing-words').val(),
                maxGridGrowth: +$('#max-grid-growth').val(),
                fillBlanks: fillBlanks,
                maxFillings: +$('#max-fillings').val(),
                allowExtraBlanks: ['none', 'secret-word-plus-blanks'].includes($('#filling-letters').val()),
                colorFillingLetters: $('#color-filling-letters').val() == 'on',
                maxAttempts: +$('#max-attemps-per-grid-and-wordset').val(),
                preferOverlap: $('#prefer-letter-overlaps').val() == 'on'
            });
        } catch (error) {
            $('#result-message').text(`😞 ${error} → Retry, specify less words or allow more missing words / grid growth`).css({color: 'red'});
            return;
        }
        wordfind.print(game.puzzle);
        var resultMsg = `😃`
        var addedLettersCount = game.addedLettersCount();
        if (addedLettersCount) {
            resultMsg += ` with ${addedLettersCount} letters added`
        }
        var emptySquaresCount = WordFindGame.emptySquaresCount();
        if (emptySquaresCount) {
            resultMsg += ` with ${emptySquaresCount} empty squares`
        }
        $('#result-message').text(resultMsg).css({color: ''});
        window.game = game;
    }
    recreateGrid();

    /* Event listeners */
    $('#filling-letters').change((evt) => $('#secret-word').prop('disabled', !evt.target.value.startsWith('secret-word')));
    </script>
</body>
</html>
